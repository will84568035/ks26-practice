<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本週主日聚會</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 20px;
    line-height: 1.6;
    color: #222;
    background: #f6f6f2;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 28px; text-align: center; }
  ul { list-style: none; padding: 0; }
  li {
    display: flex;
    justify-content: space-between;
    background: #fff;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
  }
  .time { font-weight: bold; }
  .note { font-size: 16px; color: #666; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>本週主日聚會</h1>
  <ul>
    <li><span>主日崇拜</span><span class="time">11:00</span></li>
    <li><span>兒童主日學</span><span class="time">09:00</span></li>
    <li><span>青少年團契</span><span class="time">11:00</span></li>
    <li><span>禱告會</span><span class="time">19:30</span></li>
    <li><span>小組聚會 週三</span><span class="time">20:00</span></li>
  </ul>
  <p class="note">（練習用假資料）</p>
</main>
</body>
</html>
